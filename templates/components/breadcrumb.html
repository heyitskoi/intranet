{% macro render_breadcrumb(items) %}
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">
            {% for item in items %}
                {% if loop.last %}
                    <li class="breadcrumb-item active" aria-current="page">{{ item.text }}</li>
                {% else %}
                    <li class="breadcrumb-item"><a href="{{ item.url }}">{{ item.text }}</a></li>
                {% endif %}
            {% endfor %}
        </ol>
    </nav>
{% endmacro %}
